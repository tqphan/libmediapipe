name: Build

# Builds libmediapipe (the Tasks C library) from MediaPipe's open-source tree,
# so game-face (github.com/tqphan/game-face) can ship without Google's usage
# logger. The PyPI wheels from 0.10.35 on contain that logger (Clearcut).
# mediapipe/tasks/c/BUILD compiles from source unless a library sits in
# mediapipe/tasks/c/prebuilts/, and the public repo has no prebuilts, so a
# source build leaves the logger out. scripts/check_mediapipe_lib.py and the
# import checks below confirm that for each build.
#
# Runs by hand (Actions > Build > Run workflow, with the MediaPipe ref,
# platforms and release as inputs), or when this workflow or scripts/ change.
# The Bazel flags follow MediaPipe's setup.py.
#
# OpenCV is 4.14.0 everywhere, with only the core and imgproc modules the
# Tasks library uses:
#   Linux, macOS  built from OpenCV's source at the 4.14.0 tag (commit checked)
#                 and linked statically, as MediaPipe's manylinux image does, so
#                 libmediapipe needs only the OS and C++ runtime. Linux (x86_64
#                 and arm64) needs glibc 2.39 or newer (Ubuntu 24.04); macOS 12
#                 or newer.
#   Windows x64   opencv.org's prebuilt opencv_world DLL, checked against the
#                 digest GitHub publishes, shipped next to libmediapipe.dll.
#   Windows arm64 opencv.org has no arm64 build, so built from source (MSVC)
#                 and linked statically, as on Linux and macOS.
#
# Publishing: a pushed commit whose message contains "[mediapipe release]" (or
# a manual run with "release" set) builds every platform and publishes a
# GitHub Release tagged mediapipe-<MediaPipe ref>-<short commit>, with one zip
# per platform (libraries, licenses, checksums) and a SHA256SUMS of the zips.
# game-face's cmake/FetchMediaPipe.cmake pins those zips by hash.
# A release is never overwritten; a new build gets a new commit and tag.

on:
  push:
    paths:
      - .github/workflows/build.yml
      - scripts/**
  workflow_dispatch:
    inputs:
      ref:
        description: MediaPipe tag or commit (no public tag exists for 1.0.1)
        default: v1.0.0
      platforms:
        description: Platforms to build (comma-separated linux, linux-arm64, windows, windows-arm64, macos)
        default: linux,linux-arm64,windows,windows-arm64,macos
      release:
        description: Publish a GitHub Release (builds every platform)
        type: boolean
        default: false

permissions:
  contents: read

env:
  MEDIAPIPE_REF: ${{ inputs.ref || 'v1.0.0' }}
  OPENCV_VERSION: '4.14.0'
  # The commit the 4.14.0 tag points to (api.github.com/repos/opencv/opencv/git/ref/tags/4.14.0).
  OPENCV_COMMIT: 0654a42e19215ef25b1d367d822f3c630447e7c7
  # From https://api.github.com/repos/opencv/opencv/releases/tags/<version> (asset "digest").
  OPENCV_WINDOWS_SHA256: 5f266a8b73bed535962d7e861a6457e32a0dd5f463ad0a7cf8707a135469be63
  MACOS_MIN: '12.0'

jobs:
  # Picks the platforms: the "platforms" input on a manual run, or a
  # "[mediapipe: linux-arm64,macos]" tag in the pushed commit's message; all of
  # them otherwise, and always all of them for a release.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      release: ${{ steps.pick.outputs.release }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - id: pick
        env:
          INPUT: ${{ inputs.platforms }}
          RELEASE_INPUT: ${{ inputs.release }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          all_platforms = [
              {"key": "linux", "name": "Linux x86_64", "os": "ubuntu-24.04",
               "lib": "libmediapipe.so", "artifact": "libmediapipe-linux-x86_64"},
              {"key": "linux-arm64", "name": "Linux arm64", "os": "ubuntu-24.04-arm",
               "lib": "libmediapipe.so", "artifact": "libmediapipe-linux-arm64"},
              # VS 2022's headers and libraries (clang-cl compiles); windows-latest has VS 2026.
              {"key": "windows", "name": "Windows x86_64", "os": "windows-2022",
               "lib": "libmediapipe.dll", "artifact": "libmediapipe-windows-x86_64"},
              {"key": "windows-arm64", "name": "Windows arm64", "os": "windows-11-arm",
               "lib": "libmediapipe.dll", "artifact": "libmediapipe-windows-arm64"},
              {"key": "macos", "name": "macOS arm64", "os": "macos-15",
               "lib": "libmediapipe.dylib", "artifact": "libmediapipe-macos-arm64"},
          ]
          every = ",".join(p["key"] for p in all_platforms)
          release = (os.environ["RELEASE_INPUT"] == "true"
                     or "[mediapipe release]" in os.environ["MESSAGE"])
          wanted = os.environ["INPUT"]
          if release:
              wanted = every
          elif not wanted:
              tag = re.search(r"\[mediapipe:\s*([^\]]*)\]", os.environ["MESSAGE"])
              wanted = tag.group(1) if tag else every
          keys = {k.strip().lower() for k in wanted.split(",") if k.strip()}
          unknown = keys - {p["key"] for p in all_platforms}
          if unknown or not keys:
              raise SystemExit(f"unknown or empty platforms: {sorted(unknown) or wanted!r}")
          include = [p for p in all_platforms if p["key"] in keys]
          print("Building:", ", ".join(p["name"] for p in include), "(release)" if release else "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")
              out.write("release=" + ("true" if release else "false") + "\n")
              out.write("count=" + str(len(all_platforms)) + "\n")
          EOF

  build:
    needs: platforms
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    # Per platform and never cancelled: a cancelled job saves no Bazel cache,
    # so a newer push waits for the running build of that platform instead.
    concurrency:
      group: mediapipe-${{ github.ref }}-${{ matrix.artifact }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: libmediapipe

      - uses: actions/checkout@v4
        with:
          repository: google-ai-edge/mediapipe
          ref: ${{ env.MEDIAPIPE_REF }}
          path: mediapipe

      - name: Refuse prebuilt libraries
        working-directory: mediapipe
        run: |
          if [ -e mediapipe/tasks/c/prebuilts ]; then
            echo "::error::mediapipe/tasks/c/prebuilts exists; Bazel would ship that library instead of building one."
            exit 1
          fi

      # The build tree needs more than the ~14 GB the runner has free.
      - if: runner.os == 'Linux'
        name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          module-root: mediapipe
          bazelisk-cache: true
          disk-cache: mediapipe-${{ matrix.artifact }}-${{ env.MEDIAPIPE_REF }}
          repository-cache: true

      # ---- OpenCV ------------------------------------------------------------
      # Each platform's @*_opencv repository gets a BUILD file for the two
      # modules the Tasks library uses (core, imgproc).

      # Same compiler setup as MediaPipe's manylinux image: Clang 18 on GCC 14's libstdc++.
      - if: runner.os == 'Linux'
        name: Compiler (Clang 18)
        run: sudo apt-get update && sudo apt-get install -y clang-18 g++-14 libstdc++-14-dev

      # opencv.org publishes no Windows arm64 build, so Windows arm64 builds
      # OpenCV from source and links it in, like Linux and macOS.
      - if: runner.os != 'Windows' || runner.arch == 'ARM64'
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: opencv-install
          # Bump the trailing number when the OpenCV build options change.
          key: opencv-${{ env.OPENCV_COMMIT }}-core-imgproc-static-${{ matrix.os }}-macos${{ env.MACOS_MIN }}-2

      # Everything OpenCV would pull in beyond the OS is off: LAPACK (Accelerate
      # on macOS), OpenCL, the IPP/KleidiCV/Carotene accelerators, and the image
      # codec, flatbuffers and protobuf third-party libraries (for modules not
      # built here). zlib comes from the system headers; MediaPipe links its own.
      # Windows has no system zlib, so OpenCV builds its bundled one there just
      # to compile against; only core and imgproc are linked, and their zlib
      # calls resolve to MediaPipe's zlib, as on Linux.
      # CMake's Visual Studio generator finds no instance on the arm64 image, so
      # OpenCV builds with Ninja and cl.exe from the developer environment.
      - if: runner.os == 'Windows' && runner.arch == 'ARM64' && steps.opencv-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - if: (runner.os != 'Windows' || runner.arch == 'ARM64') && steps.opencv-cache.outputs.cache-hit != 'true'
        name: Build OpenCV (source, static)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$OPENCV_VERSION" https://github.com/opencv/opencv.git opencv-src
          actual="$(git -C opencv-src rev-parse HEAD)"
          if [ "$actual" != "$OPENCV_COMMIT" ]; then
            echo "::error::OpenCV tag $OPENCV_VERSION is at $actual, expected $OPENCV_COMMIT"
            exit 1
          fi
          prefix="$PWD/opencv-install"
          zlib=(-DBUILD_ZLIB=OFF)
          if [ "$RUNNER_OS" = Linux ]; then
            platform=(-DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18)
          elif [ "$RUNNER_OS" = Windows ]; then
            # MSVC's own arm64 compiler; /MD and no /GL, so lld-link can link it
            # into the clang-cl build.
            mkdir -p "$RUNNER_TEMP/logs"
            { "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -all -prerelease -products '*' \
                | grep -E '^(displayName|installationPath|installationVersion):' || true
              command -v cl ninja link; } 2>&1 | tee "$RUNNER_TEMP/logs/vswhere.log"
            platform=(-G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_WITH_STATIC_CRT=OFF)
            zlib=(-DBUILD_ZLIB=ON -DWITH_ZLIB_NG=OFF)
            prefix="$(cygpath -m "$prefix")"
          else
            platform=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN")
          fi
          mkdir -p "$RUNNER_TEMP/logs"
          {
          cmake -S opencv-src -B opencv-build "${platform[@]}" "${zlib[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_LIST=core,imgproc \
            -DWITH_LAPACK=OFF -DWITH_OPENCL=OFF -DWITH_EIGEN=OFF -DWITH_OPENMP=OFF -DWITH_TBB=OFF \
            -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_KLEIDICV=OFF -DWITH_CAROTENE=OFF \
            -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_OPENJPEG=OFF \
            -DWITH_JASPER=OFF -DWITH_OPENEXR=OFF -DWITH_AVIF=OFF -DWITH_SPNG=OFF \
            -DWITH_FLATBUFFERS=OFF -DWITH_PROTOBUF=OFF \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF -DOPENCV_GENERATE_PKGCONFIG=OFF
          jobs="${NUMBER_OF_PROCESSORS:-$(getconf _NPROCESSORS_ONLN)}"
          cmake --build opencv-build --config Release -j "$jobs"
          cmake --install opencv-build --config Release
          } 2>&1 | tee "$RUNNER_TEMP/logs/opencv.log"

      - if: runner.os != 'Windows' || runner.arch == 'ARM64'
        name: OpenCV (use static build)
        run: |
          set -euo pipefail
          # Only core and imgproc are linked; anything else OpenCV installed is
          # listed but unused (the libmediapipe dependency check below is what counts).
          if [ "$RUNNER_OS" = Windows ]; then
            # OpenCV's Windows layout: <arch>/<vc>/staticlib/opencv_core<version>.lib.
            find opencv-install -name '*.lib' | sort
            libs=()
            for m in imgproc core; do
              mapfile -t found < <(find opencv-install -path '*/staticlib/*' -name "opencv_${m}[0-9]*.lib")
              if [ "${#found[@]}" -ne 1 ]; then
                echo "::error::expected one opencv_${m} static library, found: ${found[*]}"
                exit 1
              fi
              libs+=("\"${found[0]#opencv-install/}\"")
            done
            srcs="$(IFS=,; echo "${libs[*]}")"
            headers=include
          else
            find opencv-install/lib -name '*.a' | sort
            for a in libopencv_core.a libopencv_imgproc.a; do
              [ -f "opencv-install/lib/$a" ] || { echo "::error::opencv-install/lib/$a is missing"; exit 1; }
            done
            # imgproc before core: GNU ld resolves static libraries in order.
            srcs='"lib/libopencv_imgproc.a", "lib/libopencv_core.a"'
            headers=include/opencv4
          fi
          build="cc_library(
              name = \"opencv\",
              srcs = [$srcs],
              hdrs = glob([\"$headers/opencv2/**/*.h*\"]),
              includes = [\"$headers/\"],
              linkstatic = 1,
              visibility = [\"//visibility:public\"],
          )"
          prefix="$PWD/opencv-install"
          if [ "$RUNNER_OS" = Linux ]; then
            repo=linux_opencv; file=opencv_linux.BUILD
          elif [ "$RUNNER_OS" = Windows ]; then
            repo=windows_opencv; file=opencv_windows.BUILD
            prefix="$(cygpath -m "$prefix")"
          else
            repo=macos_opencv; file=opencv_macos.BUILD
          fi
          printf '%s\n' "$build" | tee "mediapipe/third_party/$file"
          # Point the @linux_opencv / @macos_opencv / @windows_opencv local repository at the build.
          python - "$repo" "$prefix" <<'EOF'
          import pathlib, re, sys
          repo, path = sys.argv[1], sys.argv[2]
          p = pathlib.Path("mediapipe/WORKSPACE")
          s = p.read_text()
          t = re.sub(r'(name = "%s",.*?path = )"[^"]*"' % repo, r'\g<1>"%s"' % path, s, count=1, flags=re.S)
          if t == s:
              sys.exit(repo + " repository not found in WORKSPACE")
          p.write_text(t)
          EOF
          grep -n -A4 "name = \"$repo\"" mediapipe/WORKSPACE

      - if: runner.os == 'Windows' && runner.arch == 'X64'
        name: OpenCV (opencv.org)
        run: |
          (
            cd "$RUNNER_TEMP"
            curl -fsSL --retry 3 -o opencv.exe \
              "https://github.com/opencv/opencv/releases/download/$OPENCV_VERSION/opencv-$OPENCV_VERSION-windows.exe"
            echo "$OPENCV_WINDOWS_SHA256  opencv.exe" | sha256sum -c -
            # A 7-Zip self-extractor; its top folder is opencv/. @windows_opencv is C:\opencv\build.
            7z x -y -oC:/ opencv.exe > /dev/null
          )
          ls C:/opencv/build/x64/*/bin
          cat > mediapipe/third_party/opencv_windows.BUILD <<'EOF'
          cc_library(
              name = "opencv",
              srcs = glob(
                  ["x64/vc*/lib/opencv_world*.lib", "x64/vc*/bin/opencv_world*.dll"],
                  exclude = ["x64/vc*/lib/opencv_world*d.lib", "x64/vc*/bin/opencv_world*d.dll"],
              ),
              hdrs = glob(["include/opencv2/**/*.h*"]),
              includes = ["include/"],
              linkstatic = 1,
              visibility = ["//visibility:public"],
          )
          EOF

      # With MSVC or clang-cl (protobuf's config_msvc), protobuf drops its zlib
      # dependency (and HAVE_ZLIB), yet gzip_stream.h includes <zlib.h>
      # unconditionally, which MediaPipe pulls in. Keep the dependency so the
      # header is found.
      - if: runner.os == 'Windows'
        name: Patch protobuf (zlib on Windows)
        working-directory: mediapipe
        run: |
          python - <<'EOF'
          import pathlib
          patch = (
              "--- a/src/google/protobuf/io/BUILD.bazel\n"
              "+++ b/src/google/protobuf/io/BUILD.bazel\n"
              "@@ -160,10 +160,7 @@\n"
              '         "//src/google/protobuf/stubs",\n'
              '         "@abseil-cpp//absl/log:absl_check",\n'
              '         "@abseil-cpp//absl/log:absl_log",\n'
              "-    ] + select({\n"
              '-        "//build_defs:config_msvc": [],\n'
              '-        "//conditions:default": ["@zlib"],\n'
              "-    }),\n"
              '+    ] + ["@zlib"],\n'
              " )\n"
              " \n"
              " cc_library(\n"
          )
          pathlib.Path("third_party/protobuf_msvc_zlib.patch").write_bytes(patch.encode())
          m = pathlib.Path("MODULE.bazel")
          s = m.read_text()
          old = 'strip_prefix = "protobuf-6.31.1",'
          if s.count(old) != 1:
              raise SystemExit("protobuf archive_override not found; update this step for the new protobuf version")
          m.write_text(s.replace(old, old + '\n    patches = ["//third_party:protobuf_msvc_zlib.patch"],\n    patch_strip = 1,'))
          EOF
          grep -n -A6 'module_name = "protobuf"' MODULE.bazel

      # XNNPACK's "aarch64" group leaves out Windows, so on arm64 Windows it
      # would build none of its Arm kernels while its C code still calls them.
      # Its windows_aarch64 setting also tests cpu "aarch64_windows", but
      # Bazel's arm64 Windows cpu is "arm64_windows". The patch fixes both and
      # passes the Arm and GCC-style flags through clang-cl the way XNNPACK
      # already does for x64 clang-cl.
      - if: runner.os == 'Windows' && runner.arch == 'ARM64'
        name: Patch XNNPACK (arm64 Windows)
        working-directory: mediapipe
        run: |
          python - <<'EOF'
          import pathlib
          patch = (
              "--- a/build_config/BUILD.bazel\n"
              "+++ b/build_config/BUILD.bazel\n"
              "@@ -144,7 +144,7 @@\n"
              " config_setting(\n"
              '     name = "windows_aarch64",\n'
              "     values = {\n"
              '-         "cpu": "aarch64_windows",\n'
              '+         "cpu": "arm64_windows",\n'
              "     },\n"
              " )\n"
              " \n"
              "@@ -340,6 +340,7 @@\n"
              '         ":macos_arm64",\n'
              '         ":tvos_arm64",\n'
              '         ":watchos_arm64_32",\n'
              '+        ":windows_aarch64",\n'
              "     ],\n"
              " )\n"
              " \n"
              "--- a/build_defs.bzl\n"
              "+++ b/build_defs.bzl\n"
              "@@ -351,6 +351,7 @@\n"
              '             "//build_config:macos_x86_64_legacy": gcc_x86_copts,\n'
              '             "//build_config:macos_arm64": aarch64_copts,\n'
              '             "//build_config:windows_x86_64_clangcl": ["/clang:" + opt for opt in gcc_x86_copts],\n'
              '+            "//build_config:windows_aarch64": ["/clang:" + opt for opt in aarch64_copts],\n'
              '             "//build_config:windows_x86_64_clang": gcc_x86_copts,\n'
              '             "//build_config:windows_x86_64_mingw": mingw_copts + gcc_x86_copts,\n'
              '             "//build_config:windows_x86_64_msys": msys_copts + gcc_x86_copts,\n'
              "@@ -373,6 +374,7 @@\n"
              '             "//conditions:default": [],\n'
              "         }) + select({\n"
              '             "//build_config:windows_x86_64_clangcl": ["/clang:" + opt for opt in gcc_copts],\n'
              '+            "//build_config:windows_aarch64": ["/clang:" + opt for opt in gcc_copts],\n'
              '             "//build_config:windows_x86_64_clang": gcc_copts,\n'
              '             "//build_config:windows_x86_64_mingw": gcc_copts,\n'
              '             "//build_config:windows_x86_64_msys": gcc_copts,\n'
          )
          pathlib.Path("third_party/xnnpack_windows_arm64.patch").write_bytes(patch.encode())
          w = pathlib.Path("WORKSPACE")
          s = w.read_text()
          old = 'strip_prefix = "XNNPACK-68167d1fefa50296f0588ec280f48c58357ca898",'
          if s.count(old) != 1:
              raise SystemExit("XNNPACK http_archive not found; update this step for the new XNNPACK version")
          w.write_text(s.replace(old, old + '\n    patches = ["@//third_party:xnnpack_windows_arm64.patch"],\n    patch_args = ["-p1"],'))
          EOF
          grep -n -A8 'name = "XNNPACK"' WORKSPACE

      # Windows builds with clang-cl (Clang's MSVC-compatible driver, using
      # MSVC's headers, libraries and ABI), as Google's own DLL is: MediaPipe
      # and protobuf have code that Clang accepts and the MSVC compiler doesn't.
      # Bazel picks clang-cl only on an execution platform with the clang-cl
      # constraint.
      - if: runner.os == 'Windows'
        name: clang-cl toolchain
        working-directory: mediapipe
        run: |
          llvm="C:/Program Files/LLVM"
          "$llvm/bin/clang-cl.exe" --version
          echo "BAZEL_LLVM=$llvm" >> "$GITHUB_ENV"
          mkdir -p clang_cl
          # rules_cc's constraint, which its clang-cl toolchains require;
          # @bazel_tools//tools/cpp:clang-cl is a different one.
          cat > clang_cl/BUILD.bazel <<'EOF'
          platform(
              name = "x64_windows-clang-cl",
              constraint_values = [
                  "@platforms//cpu:x86_64",
                  "@platforms//os:windows",
                  "@rules_cc//cc/private/toolchain:clang-cl",
              ],
          )

          platform(
              name = "arm64_windows-clang-cl",
              constraint_values = [
                  "@platforms//cpu:arm64",
                  "@platforms//os:windows",
                  "@rules_cc//cc/private/toolchain:clang-cl",
              ],
          )
          EOF

      # ---- Build -------------------------------------------------------------

      - if: runner.os == 'Linux'
        name: Build
        working-directory: mediapipe
        env:
          CC: clang-18
        run: |
          # An x86 (AVX) XNNPACK kernel set; the flag means nothing on arm64.
          arch_flags=()
          if [ "$RUNNER_ARCH" = X64 ]; then
            arch_flags=(--define=xnn_enable_avxvnniint8=false)
          fi
          bazel build \
            --compilation_mode=opt --strip=always --jobs=auto \
            --copt=-DNDEBUG --copt=-DLITERT_DISABLE_NPU \
            --define=MEDIAPIPE_DISABLE_GPU=1 \
            "${arch_flags[@]}" \
            --repo_env=CC=clang-18 \
            --action_env=PYTHON_BIN_PATH="$(which python)" \
            //mediapipe/tasks/c:libmediapipe
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -L bazel-bin/mediapipe/tasks/c/${{ matrix.lib }} "$GITHUB_WORKSPACE/out/"

      # PowerShell, because Git Bash rewrites the //target argument into a path.
      # Bazel's own genrules need MSYS2's bash (BAZEL_SH). The short output root
      # keeps paths under Windows' length limit. rules_swift (there for Apple
      # builds) autoconfigures a Windows toolchain that requires swiftc.exe;
      # nothing here uses Swift, so an empty repository stands in for it.
      # The clang-cl flags select the toolchain from the step above (rules_cc's
      # cc_configure repository, by its canonical name) and, via --host_platform,
      # for the tools Bazel builds too; otherwise those fall back to cl.exe.
      # Same set as TensorFlow's win_clang config.
      # The arm64 runner has no MSYS2, so Git's bash runs the genrules there.
      # rules_cc gives clang-cl no target triple, so arm64 passes one rather
      # than depend on how the runner's LLVM was built. XNNPACK's hand-written
      # assembly (GNU syntax), SME and KleidiAI kernels stay off on arm64
      # Windows; its NEON, dot-product and fp16 C kernels are built.
      - if: runner.os == 'Windows'
        name: Build
        working-directory: mediapipe
        shell: pwsh
        run: |
          $py = (Get-Command python).Source -replace '\\', '/'
          $swiftStub = "$env:RUNNER_TEMP/swift_local_config" -replace '\\', '/'
          New-Item -ItemType Directory -Force $swiftStub | Out-Null
          New-Item -ItemType File -Force "$swiftStub/BUILD.bazel", "$swiftStub/WORKSPACE" | Out-Null
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
            $env:BAZEL_SH = 'C:\Program Files\Git\usr\bin\bash.exe'
            $archFlags = @(
              '--copt=--target=aarch64-pc-windows-msvc', '--host_copt=--target=aarch64-pc-windows-msvc',
              '--define=xnn_enable_assembly=false', '--define=xnn_enable_kleidiai=false',
              '--define=xnn_enable_arm_sme=false', '--define=xnn_enable_arm_sme2=false'
            )
          } else {
            $arch = 'x64'
            $env:BAZEL_SH = 'C:\msys64\usr\bin\bash.exe'
            $archFlags = @()
          }
          if (-not (Test-Path $env:BAZEL_SH)) { throw "BAZEL_SH not found: $env:BAZEL_SH" }
          $flags = @(
            '--compilation_mode=opt', '--jobs=auto',
            '--copt=-DNDEBUG', '--copt=-DLITERT_DISABLE_NPU',
            "--extra_toolchains=@@rules_cc~~cc_configure_extension~local_config_cc//:cc-toolchain-${arch}_windows-clang-cl",
            "--extra_execution_platforms=//clang_cl:${arch}_windows-clang-cl",
            "--host_platform=//clang_cl:${arch}_windows-clang-cl", '--compiler=clang-cl',
            '--define=MEDIAPIPE_DISABLE_GPU=1',
            "--override_repository=rules_swift~~non_module_deps~build_bazel_rules_swift_local_config=$swiftStub",
            "--action_env=PYTHON_BIN_PATH=$py"
          ) + $archFlags

          # Fail fast unless Bazel resolves the clang-cl toolchain (it silently
          # falls back to MSVC's when the platform doesn't match).
          $resolution = bazel --output_user_root=C:/_bzl cquery @flags `
            '--toolchain_resolution_debug=@bazel_tools//tools/cpp:toolchain_type' `
            '@pthreadpool//:pthreadpool' 2>&1 | ForEach-Object { "$_" -replace '\x1b\[[0-9;]*m', '' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/logs" | Out-Null
          $resolution | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/logs/bazel-cquery.log"
          $selected = ($resolution -join ' ') -replace '\s+', ' ' |
            Select-String -Pattern 'type @@bazel_tools//tools/cpp:toolchain_type -> toolchain (\S+)' -AllMatches
          $toolchains = $selected.Matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          "C++ toolchain: $toolchains"
          if (-not $toolchains -or ($toolchains | Where-Object { $_ -notmatch "${arch}_windows-clang-cl" })) {
            $resolution | Select-String 'ToolchainResolution' | Select-Object -First 60
            Write-Output '::error::Bazel did not select the clang-cl toolchain.'
            exit 1
          }

          bazel --output_user_root=C:/_bzl build @flags //mediapipe/tasks/c:libmediapipe 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath "$env:RUNNER_TEMP/logs/bazel-build.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item bazel-bin/mediapipe/tasks/c/${{ matrix.lib }} "$env:GITHUB_WORKSPACE/out/"
          # On arm64 OpenCV is linked in.
          if ($arch -eq 'arm64') { exit 0 }
          # libmediapipe.dll imports opencv_world<version>.dll (not the debug "d" build).
          $opencvDll = Get-ChildItem C:/opencv/build/x64/vc*/bin/opencv_world*.dll | Where-Object { $_.Name -notmatch 'd\.dll$' }
          if (@($opencvDll).Count -ne 1) { throw "Expected one release opencv_world DLL, found: $opencvDll" }
          Copy-Item $opencvDll "$env:GITHUB_WORKSPACE/out/"

      - if: runner.os == 'macOS'
        name: Build
        working-directory: mediapipe
        run: |
          bazel build \
            --compilation_mode=opt --jobs=auto \
            --copt=-DNDEBUG --copt=-DLITERT_DISABLE_NPU \
            --define=MEDIAPIPE_DISABLE_GPU=1 \
            --cpu=darwin_arm64 --ios_multi_cpus=i386,x86_64,armv7,arm64 \
            --macos_minimum_os="$MACOS_MIN" \
            --action_env=PYTHON_BIN_PATH="$(which python)" \
            //mediapipe/tasks/c:libmediapipe
          mkdir -p "$GITHUB_WORKSPACE/out"
          lib="$GITHUB_WORKSPACE/out/${{ matrix.lib }}"
          cp -L bazel-bin/mediapipe/tasks/c/${{ matrix.lib }} "$lib"
          chmod u+w "$lib"
          # Bazel leaves a bazel-out/... install name; give it the usual @rpath one
          # and re-sign (ad hoc), since editing the header invalidates the signature.
          install_name_tool -id @rpath/libmediapipe.dylib "$lib"
          codesign --force --sign - "$lib"

      # ---- Checks ------------------------------------------------------------

      - name: Check for telemetry and C API
        run: python libmediapipe/scripts/check_mediapipe_lib.py out/${{ matrix.lib }}

      - if: runner.os == 'Linux'
        name: Check imports
        run: |
          lib=out/${{ matrix.lib }}
          echo "Dependencies:"; readelf -d "$lib" | grep NEEDED
          # OpenCV is linked in, so only glibc and the C++ runtime may remain.
          other="$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' \
            | grep -vxE 'libc\.so\.6|libm\.so\.6|libstdc\+\+\.so\.6|libgcc_s\.so\.1|ld-linux-x86-64\.so\.2|ld-linux-aarch64\.so\.1|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1' || true)"
          if [ -n "$other" ]; then
            echo "::error::$lib needs libraries outside glibc and the C++ runtime:"
            echo "$other"
            exit 1
          fi
          net="$(nm -D --undefined-only "$lib" | awk '{print $NF}' | sed 's/@.*//' \
            | grep -xE 'socket|connect|getaddrinfo|gethostbyname|curl_.*|SSL_.*' || true)"
          if [ -n "$net" ]; then
            echo "::error::$lib imports network functions:"
            echo "$net"
            exit 1
          fi
          echo "No network imports."

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - if: runner.os == 'Windows'
        name: Check imports
        shell: pwsh
        run: |
          $lib = "out/${{ matrix.lib }}"
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'x64' }
          $header = dumpbin /nologo /headers $lib | Select-String -Pattern 'machine \((\S+)\)' | Select-Object -First 1
          "Machine: $header"
          if (-not $header -or $header.Matches[0].Groups[1].Value -ne $machine) {
            Write-Output "::error::$lib is not a $machine DLL"
            exit 1
          }
          dumpbin /nologo /dependents $lib
          if ($machine -eq 'ARM64') {
            # OpenCV is linked in, so no OpenCV DLL may be imported.
            $opencv = dumpbin /nologo /dependents $lib | Select-String -Pattern '^\s+opencv' -CaseSensitive:$false
            if ($opencv) {
              Write-Output "::error::$lib imports an OpenCV DLL:"
              $opencv
              exit 1
            }
          }
          $net = dumpbin /nologo /dependents $lib | Select-String -Pattern '^\s+(wininet|winhttp|ws2_32|wsock32|urlmon)\.dll' -CaseSensitive:$false
          if ($net) {
            Write-Output "::error::$lib imports network libraries:"
            $net
            exit 1
          }
          'No network imports.'

      - if: runner.os == 'macOS'
        name: Check imports
        run: |
          lib=out/${{ matrix.lib }}
          echo "Dependencies:"; otool -L "$lib"
          # OpenCV is linked in, so only the OS may remain (no Homebrew or other paths).
          other="$(otool -L "$lib" | tail -n +2 | awk '{print $1}' \
            | grep -vE '^(/usr/lib/|/System/Library/|@rpath/libmediapipe\.dylib$)' || true)"
          if [ -n "$other" ]; then
            echo "::error::$lib links libraries outside the OS:"
            echo "$other"
            exit 1
          fi
          minos="$(otool -l "$lib" | awk '/LC_BUILD_VERSION/ {f=1} f && $1 == "minos" {print $2; exit}')"
          echo "Minimum macOS: $minos"
          if [ "$minos" != "$MACOS_MIN" ]; then
            echo "::error::$lib targets macOS $minos, expected $MACOS_MIN"
            exit 1
          fi
          codesign --verify --verbose "$lib"
          net="$( { nm -gu "$lib" | grep -xE '_(socket|connect|getaddrinfo|gethostbyname|curl_.*|SSL_.*)';
                    otool -L "$lib" | grep -E 'CFNetwork|Network\.framework|libcurl'; } || true)"
          if [ -n "$net" ]; then
            echo "::error::$lib imports network code:"
            echo "$net"
            exit 1
          fi
          echo "No network imports."

      # Both are Apache-2.0, which asks for the license to travel with binaries
      # (OpenCV is linked into libmediapipe on Linux, macOS and Windows arm64).
      - name: Licenses
        run: |
          set -euo pipefail
          cp mediapipe/LICENSE out/LICENSE.mediapipe
          curl -fsSL --retry 3 -o out/LICENSE.opencv "https://raw.githubusercontent.com/opencv/opencv/$OPENCV_COMMIT/LICENSE"

      - name: Checksum
        working-directory: out
        run: |
          python - * <<'EOF' | tee SHA256SUMS
          import hashlib, sys
          for name in sorted(sys.argv[1:]):
              print(hashlib.sha256(open(name, "rb").read()).hexdigest() + "  " + name)
          EOF
          echo "Built from google-ai-edge/mediapipe ${{ env.MEDIAPIPE_REF }} ($(git -C ../mediapipe rev-parse HEAD))" | tee SOURCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/

      # Logs need a GitHub login to read; annotations are public.
      - if: failure()
        name: Annotate failure
        run: |
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/logs/*.log)
          if [ "${#logs[@]}" -gt 0 ]; then
            python libmediapipe/scripts/annotate_log.py "${logs[@]}"
          fi

  # Runs only when every platform built and passed its checks.
  publish:
    needs: [platforms, build]
    if: needs.platforms.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM_COUNT: ${{ needs.platforms.outputs.count }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libmediapipe-*
          path: artifacts

      - name: Package
        id: package
        run: |
          set -euo pipefail
          tag="mediapipe-${MEDIAPIPE_REF}-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists; releases are not overwritten. Push a new commit to publish again."
            exit 1
          fi
          dirs=(artifacts/libmediapipe-*)
          if [ "${#dirs[@]}" -ne "$PLATFORM_COUNT" ]; then
            echo "::error::Expected $PLATFORM_COUNT platform artifacts, got: ${dirs[*]}"
            exit 1
          fi
          mkdir dist
          for dir in "${dirs[@]}"; do
            platform="${dir#artifacts/libmediapipe-}"
            (cd "$dir" && zip -q -r -X "$GITHUB_WORKSPACE/dist/libmediapipe-$MEDIAPIPE_REF-$platform.zip" .)
          done
          (cd dist && sha256sum *.zip | tee SHA256SUMS)
          source="$(cat artifacts/libmediapipe-linux-x86_64/SOURCE.txt)"
          cat > notes.md <<EOF
          libmediapipe (the MediaPipe Tasks C API library) built from the open-source MediaPipe tree, without the Clearcut usage logger that PyPI's mediapipe wheels ship from 0.10.35 on. Each library passed \`scripts/check_mediapipe_lib.py\` (no telemetry strings, all C API functions game-face uses) and a check for network imports.

          $source. Workflow: [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at libmediapipe commit $GITHUB_SHA.

          | Zip | Compiler | Runs on | OpenCV $OPENCV_VERSION (core, imgproc) |
          |---|---|---|---|
          | linux-x86_64 | Clang 18 (Ubuntu 24.04) | glibc 2.39+ | built from source, linked in |
          | linux-arm64 | Clang 18 (Ubuntu 24.04) | glibc 2.39+ | built from source, linked in |
          | windows-x86_64 | clang-cl (LLVM) with VS 2022 | Windows 10+ | opencv.org opencv_world DLL, included |
          | windows-arm64 | clang-cl (LLVM) with VS 2022 | Windows 11 on Arm | built from source, linked in |
          | macos-arm64 | Apple Clang | macOS $MACOS_MIN+ | built from source, linked in |

          On Linux and macOS libmediapipe needs nothing beyond the OS and C++ runtime. On Windows x64 it needs the included opencv_world DLL next to it and the Microsoft Visual C++ runtime; on Windows arm64 OpenCV is linked in, so it needs only the Microsoft Visual C++ runtime. MediaPipe and OpenCV are Apache-2.0; their licenses are in each zip. SHA256SUMS lists the zips; each zip has its own SHA256SUMS for its files.
          EOF
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: libmediapipe ${{ env.MEDIAPIPE_REF }} without telemetry (${{ steps.package.outputs.tag }})
          body_path: notes.md
          files: dist/*
